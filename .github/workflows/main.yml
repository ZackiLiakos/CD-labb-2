name: Bygg och Publicera Webbplats

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Ladda ner kod
      uses: actions/checkout@v4

    - name: Kör enklare kontroll
      run: |
        echo "Kontrollerar att index.html existerar..."
        test -f index.html
        echo "Test godkänt!"

    # 1. Ladda upp webbfilerna som en artefakt som Pages kan använda
    - name: Ladda upp artefakt för GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    # 2. Publicera till GitHub Pages
    - name: Publicera till GitHub Pages
      uses: actions/deploy-pages@v4