name: Staging och Produktion CI/CD

on:
  push:
    branches: [ main, master ]

jobs:
  # --- 1. BYGG OCH TESTA (CI) ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ladda ner kod
        uses: actions/checkout@v4

      - name: Kör säkerhetskontroll
        run: |
          echo "Kontrollerar kodkvalitet..."
          test -f index.html
          # Säkerställ att inga lösenord finns kvar
          if grep -q "password" index.html; then
            echo "FEL: Lösenord hittat i koden!"
            exit 1
          fi
          echo "Tester godkända!"
# --- 2. PUBLICERA TILL STAGING ---
  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Ladda ner kod
        uses: actions/checkout@v4

      - name: Ladda upp artefakt för Staging
        uses: actions/upload-pages-artifact@v3
        with:
          name: staging-artifact # Unikt namn för staging
          path: '.'

      - name: Publicera till Staging
        run: echo "Koden är nu redo och testad i Staging-miljön!"

  # --- 3. PUBLICERA TILL PRODUKTION (Med skyddad miljö) ---
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: https://zackiliakos.github.io/CD-labb-2/
    
    permissions:
      contents: read
      pages: write
      id-token: write

   steps:
      - name: Ladda ner kod
        uses: actions/checkout@v4

      - name: Ladda upp artefakt för Produktion
        uses: actions/upload-pages-artifact@v3
        with:
          name: production-artifact
          path: '.'

      - name: Publicera till GitHub Pages (Produktion)
        uses: actions/deploy-pages@v4
        with:
          artifact_name: production-artifact # Berätta för deploy-steget vilken artefakt som ska användas