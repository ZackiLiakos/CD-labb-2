name: Bygg, Testa och Publicera

on:
  push:
    branches: [ main, master ]

jobs:
  # --- STEG 1: CI (Continuous Integration / Tester) ---
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Ladda ner kod
        uses: actions/checkout@v4

      - name: Kör säkerhets- och filkontroll
        run: |
          echo "Kör automatiska tester på koden..."
          # Kontrollera att index.html finns
          test -f index.html
          # Enkel säkerhetskoll: leta efter obehöriga skript eller känslig data (exempel)
          if grep -q "password" index.html; then
            echo "VARNING: Möjligt lösenord hittat i HTML-koden!"
            exit 1
          fi
          echo "Alla tester godkända!"

  # --- STEG 2: CD (Continuous Deployment / Publicering) ---
  deploy:
    needs: test-and-lint  # Detta jobb körs BARA om 'test-and-lint' lyckas!
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Ladda ner kod
        uses: actions/checkout@v4

      - name: Ladda upp artefakt för GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicera till GitHub Pages
        uses: actions/deploy-pages@v4